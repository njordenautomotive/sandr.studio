[project]
name = "sandr-studio"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "email-validator>=2.2.0",
  "fastapi==0.110.1",
  "motor==3.3.1",
  "pydantic>=2.6.4",
  "pyjwt>=2.10.1",
  "pymongo==4.5.0",
  "python-dotenv>=1.0.1",
  "uvicorn==0.25.0"
]

[project.scripts]
app = "backend.server:app"

[tool.vercel.scripts]
build = "python build.py"
